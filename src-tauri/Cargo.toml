[package]
name = "gdexplorer"
version = "0.2.34"
description = "GDExplorer"
authors = ["vo1x"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Checks src-tauri/remote-status.json at build time. See build.rs.
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-process = "2"
log = "0.4"
# Matches the version tauri-plugin-log builds its dispatch chain with; the log
# panel plugs an extra sink into that chain.
fern = "0.7"
regex = "1.11.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "process"] }
walkdir = "2"
libc = "0.2"
zip = "0.6"
# Reads a fresh socket's SO_SNDBUF, the cap on every rclone connection on
# Windows. See `send_buffer`.
socket2 = "0.5"
# The remote switch and access password (`remote_status`): PBKDF2-SHA256 and
# SHA-256 from ring (already built for rustls), base64 for the document's salt
# and hash, and the OS credential store that remembers the password per user.
ring = "0.17"
base64 = "0.22"
url = "2"
keyring = "4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Calls Windows directly instead of shelling out to PowerShell: physical memory
# (`upload::memory`), the completion beep, and the elevated registry write in
# `send_buffer`. Antivirus heuristics treat hidden PowerShell as malware.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# Reads HKLM: an old all-users install (`service::all_users_install`) and the
# AFD send buffer (`send_buffer`).
winreg = "0.55"

[dev-dependencies]
# Lets the memory tests move the clock instead of sleeping through holds; the
# remote status tests run a local HTTP server.
tokio = { version = "1", features = ["test-util", "net", "io-util"] }

# Optimize for smaller binary size in release builds
[profile.release]
codegen-units = 1        # Better LLVM optimization (slower build, smaller binary)
lto = true               # Link-time optimizations
opt-level = "s"          # Optimize for size over speed
panic = "abort"          # Don't include panic unwinding code
strip = true             # Remove debug symbols
